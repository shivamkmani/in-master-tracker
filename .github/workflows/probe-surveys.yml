name: Try the surveys fetcher (temporary)
on:
  push:
    branches: [surveys]
    paths: [pipeline/fetch_surveys.py, .github/workflows/probe-surveys.yml]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python pipeline/fetch_surveys.py
      - name: Summarise and save the result to this branch
        run: |
          python3 - <<'PY'
          import json, collections
          d = json.load(open("site/data/surveys.json")); D = d["dims"]
          rows = [(D["dataset"][r[0]], D["segment"][r[2]], D["indicator"][r[3]], r[5], r[6]) for r in d["rows"]]
          print("rows", len(rows))
          for ds in sorted({r[0] for r in rows}):
              ps = sorted({r[3] for r in rows if r[0] == ds}); print(ds, "periods", len(ps), ps[0], "to", ps[-1])
              print("  segments", sorted({r[1] for r in rows if r[0] == ds}))
          for r in rows:
              if r[2].startswith("Net response, current") and r[1] == "Economic situation": print("  ", r)
          PY
          git config user.name "tracker-bot"; git config user.email "actions@users.noreply.github.com"
          git add site/data/surveys.json && git commit -m "Test fetch of RBI surveys (branch only)" && git push || true
