name: Update data and deploy

on:
  schedule:
    - cron: "30 1 * * *"   # 07:00 IST daily
  workflow_dispatch:
    inputs:
      full:
        description: "Also refresh ASI (slow, annual data)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # A full run with ASI takes over an hour (one request per state and
    # industry, paced for MoSPI); daily runs finish in about 20 minutes.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch developments
        if: github.event_name != 'push'
        run: |
          python pipeline/fetch_news.py
          python pipeline/backfill_news.py 1
      - name: Fetch data
        if: github.event_name != 'push'
        run: python pipeline/fetch_data.py ${{ inputs.full == true && '--full' || '--skip-asi' }}
      - name: Import daily updates document
        # Runs on every trigger, so uploading a new copy to picks/ updates the
        # site within minutes. A bad document must not block the data refresh.
        continue-on-error: true
        run: python pipeline/import_picks.py
      - name: Commit refreshed data
        run: |
          git config user.name "tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet && exit 0
          git commit -m "${{ github.event_name == 'push' && 'Import daily updates' || 'Daily data refresh' }}"
          git pull --rebase -q
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
